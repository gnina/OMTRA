# Koes lab cluster site configuration
# Usage: python -m omtra_pipelines.distributed_sampling.launch_pipeline --site cluster ...

slurm:
  partition_gpu: dept_gpu
  partition_cpu: dept_cpu
  cpus_per_task: 4
  mem: 32G
  time_sampling: "4:00:00"
  time_metrics: "8:00:00"
  time_aggregate: "0:30:00"
  conda_env: omtra
  extra_sbatch_args: ""

paths:
  plinder: /net/galaxy/home/koes/icd3/moldiff/OMTRA/data/plinder
  crossdocked: /net/galaxy/home/koes/icd3/moldiff/OMTRA/data/crossdocked/internal_split0
