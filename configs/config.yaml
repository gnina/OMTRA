defaults:
  - _self_
  - model: default
  - ligand_encoder: none
  - trainer: default
  - task_group: protein
  - graph: default
  - prior: 
    - conformer_indep_offset
    - denovo_permute_offset
  - callbacks: no_checkpoint
  - wandb_conf: default
  - eval: default

mode: omtra # mode for training, can be omtra (train omtra) or ligand_encoder (train just the ligand encoder)

seed: 42

# Data-parallel sampling. Each rank must see DIFFERENT batches. 'auto' = distributed sampling whenever
# trainer.devices * trainer.num_nodes > 1 (ranks draw disjoint chunk fractions; the task/dataset draw is broadcast from rank 0).
# 'false' reproduces the legacy behaviour (every rank draws the same batches from the same seed => extra GPUs add nothing);
# only use it to resume a run that was started that way.
distributed_sampling: auto  # auto | true | false

name: i_forgot_to_name_my_run

# global overrides
edges_per_batch: 300000 # TODO: it might be the case the pharmit and plinder tasks support different batch sizes..
num_workers: 2
max_steps: 1000 # number of steps to train for
fake_atom_p: 0.3 # upper bound on fraction of fake atoms added to a molecule
distort_p: 0.2  # upper bound on fraction of atoms distorted
plinder_pskip_factor: 0.0 # 0 -> no weighted sampling, 1 -> uniform sampling over clusters
plinder_exclude_file: null   # path to exclusion list; null = no filtering
crossdocked_exclude_file: null   # path to CrossDocked PDB-code exclusion list; null = no filtering
res_id_embed_dim: 64 # dimension of residue id embedding
crop_min_distance: 4 # minimum crop distance for Plinder + CrossDocked dynamic cropping
crop_max_distance: 10 # maximum crop distance for Plinder + CrossDocked dynamic cropping
alpha: null # beta-distribution alpha for Plinder + CrossDocked dynamic cropping (null -> no dynamic crop)
beta: null # beta-distribution beta for Plinder + CrossDocked dynamic cropping (null -> no dynamic crop)
additional_prot_crop: null # additional fixed distance to crop protein pocket during inference (test split)
pharm_pos_std: 0.0 # maximum per-point Gaussian std; sigma sampled uniformly from [0, value]
prot_pos_std: 0.0 # optional fixed-pocket input noise; flexible docking has its own 1 A prior
lig_com_offset_std: 0.0 # maximum uniform radial ligand-prior center offset (not a Gaussian std)
lig_com_offset_zero_p: 0.0 # fraction of samples that receive no COM offset (0 -> all samples offset)
offset_std: 0.0 # offset to prior positions

pharmit_path: ${omtra_root:}/data/pharmit
plinder_path: ${omtra_root:}/data/plinder
crossdocked_path: ${omtra_root:}/data/crossdocked/internal_split0


# this is a directory that will symlink wandb 
# run names and run ids to the actual hydra output directory
symlink_dir: ./wandb_symlinks

hydra:
  run:
    # make the timestap use milliseconds
    dir: ./outputs/${now:%Y-%m-%d}/${name}_${now:%Y-%m-%d_%H-%M-%f}
partial_mode: whole_fragments
partial_bernoulli_p: null # null samples probability uniformly, matching historical runs
fixed_coord_max_std: 0.0
fixed_token_max_prob: 0.0
