_target_: omtra.models.vector_field.VectorField

defaults:
  - _self_
  - transformer_cfg: default

n_vec_channels:                32
n_cp_feats:                    8
n_hidden_scalars:              256
n_hidden_edge_feats:           36
rbf_dmax:                      10
rbf_dim:                       32
time_embedding_dim:            64
token_dim:                     64
has_mask:                      true
self_conditioning:             true
res_id_embed_dim:              64
pos_emb:                       false
n_pre_gvp_convs:               1
fixed_coord_max_std:           0.0
fixed_token_max_prob:          0.0

# Marginal distribution for fixed token corruption
# Uses data-marginal corruption by default (samples from empirical token distribution)
marginal_path:                 ${pharmit_path}/train_marginals.npz
marginal_keys:
  lig_cond_a: lig_cond_a_marginal
  lig_e_condensed: lig_e_marginal