_target_: omtra.models.omtra.OMTRA

defaults:
  - _self_
  - conditional_paths: default
  - vector_field: default
  - optimizer: default
  - aux_losses: default

k_checkpoints: 15
checkpoint_interval: 5000
fake_atom_p: ${fake_atom_p}
distort_p: ${distort_p}
zero_bo_loss_weight: 1.0
train_t_dist: beta
t_alpha: 1.8
cat_loss_weight: 0.8
time_scaled_loss: False
pharm_pos_std: ${pharm_pos_std}
bernoulli_mask_p: ${bernoulli_mask_p}
lr_warmup_steps: 5000


scheduler_config:
  type: cosine_decay
  min_lr_factor: 0.1  # Optional, defaults to 0.1 (1


