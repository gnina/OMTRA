_target_: omtra.models.omtra.OMTRA

defaults:
  - _self_
  - conditional_paths: default
  - vector_field: default
  - optimizer: default
  - aux_losses: default

k_checkpoints: 15
checkpoint_interval: 5000
fake_atom_p: ${fake_atom_p}
distort_p: ${distort_p}
zero_bo_loss_weight: 1.0
train_t_dist: beta
t_alpha: 1.8
cat_loss_weight: 0.8
time_scaled_loss: False
pharm_pos_std: ${pharm_pos_std}
lig_com_offset_std: ${lig_com_offset_std}
lig_com_offset_zero_p: ${lig_com_offset_zero_p}
fixed_coord_max_std: ${fixed_coord_max_std}
fixed_token_max_prob: ${fixed_token_max_prob}
prot_pos_std: ${prot_pos_std}
