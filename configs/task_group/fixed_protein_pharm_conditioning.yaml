# this block must be included in all task_group configs
# especially the datamodule: default attribue
defaults:
  - _self_
  - datamodule: default


# Define tasks with time-varying probabilities
# this is p(task) but p(task) can change through the course of training
task_phases:
  - duration_batches: null
    tasks:
      - name: fixed_protein_pharmacophore_ligand_denovo
        probability: 0.475
      - name: rigid_docking_pharmacophore
        probability: 0.475
      - name: denovo_ligand_from_pharmacophore
        probability: 0.015
      - name: ligand_conformer_from_pharmacophore
        probability: 0.015
      - name: denovo_ligand
        probability: 0.01
      - name: ligand_conformer
        probability: 0.01

# define p(dataset|task) coupling (assume static for simplicity)
dataset_task_coupling:
  fixed_protein_pharmacophore_ligand_denovo:
    - [plinder, 1.0]
  rigid_docking_pharmacophore:
    - [plinder, 1.0]
  denovo_ligand_from_pharmacophore:
    - [pharmit, 1.0]
  ligand_conformer_from_pharmacophore:
    - [pharmit, 1.0]
  denovo_ligand:
    - [pharmit, 1.0]
  ligand_conformer:
    - [pharmit, 1.0]
